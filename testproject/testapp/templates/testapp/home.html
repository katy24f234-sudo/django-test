{% extends "shopbase.html" %}
{% block title %}Home{% endblock title %}
{% block content %}
        <!-- Header-->
        <header class="bg-dark py-5">
            <div class="container px-4 px-lg-5 my-5">
                <div class="text-center text-white">
                    <h1 class="display-4 fw-bolder">Shop in style</h1>
                    {% if request.user.is_authenticated %}
                    <p class="lead fw-normal text-white-50 mb-0">Welcome {{user.first_name}}</p>
                    {% endif %}
                </div>
            </div>
        </header>
        <!-- Section-->
        
        <section class="py-5">
            <div class="container px-4 px-lg-5 mt-5">
                
                <div class="row gx-4 gx-lg-5 row-cols-2 row-cols-md-3 row-cols-xl-4 justify-content-center">
                    {% for product in products %}
                    <div class="col mb-5">
                        <div class="card h-100">
                            <!-- Product image-->
                            <a href="{% url "product_details" product.id %}">
                            <img class="card-img-top" src="{{product.image.url}}" alt="..." />
                            </a>
                            <!-- Product details-->
                            <div class="card-body p-4">
                                <div class="text-center">
                                    <!-- Product name-->
                                    <h5 class="fw-bolder">{{product.name}} (mini)</h5>
                                    <!-- Product price-->
                                    ${{product.price}}
                                </div>
                            </div>
                            <!-- Product actions-->
                             <form action="">
                            <div class="card-footer p-4 pt-0 border-top-0 bg-transparent">
                                <div class="text-center"><button type="submit" class="btn btn-outline-dark mt-auto" >add to cart</button></div>
                            </div>
                            </form>
                            
                        </div>
                    </div>
                    
                    {% endfor %}
                </div>
            </div>
        </section>
{% endblock content %}
