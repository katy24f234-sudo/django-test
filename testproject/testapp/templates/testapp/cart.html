{% extends "shopbase.html" %}

{% block title %}
Cart
{% endblock %}

{% block content %}

<div class="container py-5">

    <h1 class="mb-4">Shopping Cart</h1>

    <div class="row">

        <!-- Cart items -->
        <div class="col-lg-8">

            <div class="card mb-3">

                <div class="card-body">

                    <div class="row align-items-center">

                        <div class="col-md-3">
                            <img src="https://dummyimage.com/200x200/dee2e6/6c757d.jpg"
                                 class="img-fluid rounded"
                                 alt="Product">
                        </div>


                        <div class="col-md-4">

                            <h5 class="card-title">
                                Product Name
                            </h5>

                            <p class="text-muted">
                                Short description
                            </p>

                        </div>


                        <div class="col-md-2">

                            <label class="form-label">
                                Quantity
                            </label>

                            <input type="number"
                                   class="form-control"
                                   value="1"
                                   min="1">

                        </div>


                        <div class="col-md-2">

                            <h5>
                                $99
                            </h5>

                        </div>


                        <div class="col-md-1">

                            <button class="btn btn-danger btn-sm">
                                ×
                            </button>

                        </div>

                    </div>

                </div>

            </div>


            <!-- Duplicate this card for more products -->


        </div>


        <!-- Summary -->
        <div class="col-lg-4">

            <div class="card">

                <div class="card-body">

                    <h4 class="card-title">
                        Cart Summary
                    </h4>


                    <hr>


                    <div class="d-flex justify-content-between">

                        <span>
                            Subtotal
                        </span>

                        <span>
                            $99
                        </span>

                    </div>


                    <div class="d-flex justify-content-between">

                        <span>
                            Shipping
                        </span>

                        <span>
                            Free
                        </span>

                    </div>


                    <hr>


                    <div class="d-flex justify-content-between">

                        <h5>
                            Total
                        </h5>

                        <h5>
                            $99
                        </h5>

                    </div>


                    <button class="btn btn-dark w-100 mt-3">
                        Checkout
                    </button>


                    <a href="#" class="btn btn-outline-secondary w-100 mt-2">
                        Continue Shopping
                    </a>


                </div>

            </div>

        </div>


    </div>

</div>

{% endblock %}
